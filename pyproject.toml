[project]
name = "risk-regulatory-qa"
version = "0.1.0"
description = "Versioned regulatory evidence retrieval and bounded question answering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "langgraph>=1,<2", "openai>=2,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1",
  "pypdf>=5,<7", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "rank-bm25>=0.2,<1", "numpy>=2,<3", "scikit-learn>=1.6,<2", "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5,<6", "torch>=2.6,<3", "transformers>=4.51,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_qa"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "--basetemp=.pytest_tmp"
markers = ["integration: needs explicit real component configuration", "live: uses paid API calls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
