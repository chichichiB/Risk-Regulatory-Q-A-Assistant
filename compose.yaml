name: risk-regulatory-qa
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: riskqa
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d riskqa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
