name: risk-regulatory-qa
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://risk:localdev@db:5432/riskqa
      DATA_DIR: /app/data
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: riskqa
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d riskqa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
